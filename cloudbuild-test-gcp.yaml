steps:
  # 1. Build Migration Image (Validation only)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Validate Migration Build'
    args: [
      'build', 
      '-t', 'pacs-migrations:test', 
      '-f', 'backend/migrations/Dockerfile.flyway', 
      'backend/.'
    ]

  # 2. Build Backend Image (Validation only)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Validate Backend Build'
    args: [
      'build', 
      '-t', 'pacs-backend:test', 
      '-f', 'backend/Dockerfile', 
      'backend/.' 
    ]

  # 3. Smoke Test Backend (The Core Validation)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Smoke Test Backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Run the container locally to ensure it starts without errors
        docker run -d \
          --name smoke-test-backend \
          -e DATABASE_URL=postgresql://user:pass@localhost:5432/db \
          pacs-backend:test
        
        sleep 5
        docker logs smoke-test-backend
        
        # Check if the container stayed alive
        if [ "$(docker inspect -f '{{.State.Running}}' smoke-test-backend)" = "false" ]; then
          echo "❌ ERROR: Backend crashed on startup! Check imports and paths."
          exit 1
        fi
        
        echo "✅ SUCCESS: Backend started and is healthy."
        docker stop smoke-test-backend

  # 4. Build Frontend Image (Validation only)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Validate Frontend Build'
    args: [
      'build', 
      '-t', 'pacs-ui:test', 
      '-f', 'frontend/Dockerfile', 
      'frontend/.'
    ]

options:
  logging: CLOUD_LOGGING_ONLY